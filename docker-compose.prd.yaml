services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      - DATABASE_URL=mysql://shurl:shurl@database:3306/shurl
      - REDIS_URL=redis://redis:6379
    env_file:
      - apps/api/.env
    ports:
      - 3000:3000

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_URL=https://api.example.com/shurl/api
      - OIDC_ISSUER=https://sso.example.com/realms/shurl
      - OIDC_CLIENT_ID=shurl
    ports:
      - 80:80

  redis:
    image: redis:alpine
    ports:
      - 6379:6379
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

  database:
    image: mysql:8.4
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=shurl
      - MYSQL_USER=shurl
      - MYSQL_PASSWORD=shurl
    ports:
      - 3306:3306
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    ports:
      - 8080:8080
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import

volumes:
  db:
