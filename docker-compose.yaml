services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    develop:
      watch:
        - action: sync+restart
          path: ./apps/api/src
          target: /app/apps/api/src
          initial_sync: true
        - action: rebuild
          path: package.json
        - action: rebuild
          path: apps/api/package.json
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      - DATABASE_URL=mysql://shurl:shurl@database:3306/shurl
      - MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL=true
      - REDIS_URL=redis://redis:6379
      - JWKS_URI=http://keycloak:8080/realms/shurl/protocol/openid-connect/certs
      - JWK_ISSUER=http://localhost:8080/realms/shurl
      - AUDIENCE=shurl
      - JWT_ROLE_CLAIM=resource_access.shurl.roles
      - JWT_USERNAME_CLAIM=preferred_username
    env_file:
      - apps/api/.env
    ports:
      - 3000:3000

  redis:
    image: redis:alpine
    ports:
      - 6379:6379
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

  database:
    image: mysql:9
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=shurl
      - MYSQL_USER=shurl
      - MYSQL_PASSWORD=shurl
    ports:
      - 3306:3306
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ['start-dev', '--import-realm']
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    ports:
      - 8080:8080
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro

volumes:
  db:
