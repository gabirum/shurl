apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: shurl
spec:
  # Headless: required for a StatefulSet, and gives each replica a stable DNS name
  # (redis-0.redis.<ns>.svc). With a single replica, `redis://redis:6379` still resolves fine.
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
