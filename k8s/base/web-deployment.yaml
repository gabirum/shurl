apiVersion: apps/v1
kind: Deployment
metadata:
  name: shurl-web
  labels:
    app.kubernetes.io/name: shurl-web
    app.kubernetes.io/part-of: shurl
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shurl-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shurl-web
        app.kubernetes.io/part-of: shurl
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/gabirum/shurl-web
          ports:
            - name: http
              containerPort: 80
          # Keys must be unprefixed (API_URL, OIDC_ISSUER, OIDC_CLIENT_ID) — nginx's
          # /docker-entrypoint.d/99-runtime-env.sh envsubst's them straight into
          # /usr/share/nginx/html/shurl/runtime_env.js, which apps/web/src/env.ts reads off
          # window.RUNTIME_ENV at runtime (see apps/web/public/runtime_env.js).
          envFrom:
            - configMapRef:
                name: shurl-web-config
          # Deliberately less locked-down than the api container: the stock nginx image's
          # /docker-entrypoint.d/ scripts run as root and 99-runtime-env.sh rewrites
          # runtime_env.js in place on every boot, so the filesystem must stay writable and
          # nginx needs the capabilities below to bind port 80 and drop privileges afterwards.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
              cpu: 1
