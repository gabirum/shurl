apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shurl-admin
spec:
  # The Gateway itself is shared cluster infrastructure and isn't managed here — point this
  # at whatever Gateway your cluster already has, in whichever namespace it lives.
  parentRefs:
    - name: shurl-gateway
      namespace: gateway
  # Administrative host (ADMIN_HOST in apps/api): the management API/docs and the SPA.
  hostnames:
    - admin.sh.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /shurl/api
      backendRefs:
        - name: shurl-api
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /shurl
      backendRefs:
        - name: shurl-web
          port: 80
    # / (exact) is the SPA's own root redirect (apps/web/default.conf: 302 -> /shurl/).
    - matches:
        - path:
            type: Exact
            value: /
      backendRefs:
        - name: shurl-web
          port: 80
---
# Short-link domains are registered at runtime (apps/api's `domains` table). List each
# registered domain under `hostnames` (omitting the field entirely matches every host not
# claimed by a more specific route, which also works if your Gateway listeners allow it): the
# api dispatches by Host header (apps/api/src/index.ts). Each domain still needs DNS and a TLS
# listener/certificate on the Gateway. The api's own /metrics stays IP-restricted and is scraped
# in-cluster (see k8s/base/api-service.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shurl-redirect
spec:
  parentRefs:
    - name: shurl-gateway
      namespace: gateway
  hostnames:
    - sh.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: shurl-api
          port: 80
