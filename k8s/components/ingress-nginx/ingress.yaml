apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shurl-admin
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
spec:
  ingressClassName: nginx
  tls:
    - hosts: [admin.sh.example.com]
      secretName: shurl-admin-tls
  rules:
    # Administrative host (ADMIN_HOST in apps/api): the management API/docs and the SPA.
    - host: admin.sh.example.com
      http:
        paths:
          - path: /shurl/api
            pathType: Prefix
            backend:
              service:
                name: shurl-api
                port:
                  name: http
          - path: /shurl
            pathType: Prefix
            backend:
              service:
                name: shurl-web
                port:
                  name: http
          # / (exact) is the SPA's own root redirect (apps/web/default.conf: 302 -> /shurl/).
          - path: /
            pathType: Exact
            backend:
              service:
                name: shurl-web
                port:
                  name: http
---
# Short-link domains are registered at runtime (apps/api's `domains` table), so this ingress has
# no host: it catches every Host not claimed by a more specific rule and forwards it to the api,
# which dispatches by Host header (apps/api/src/index.ts) — a registered domain serves
# GET /{code}, anything else only /health and /metrics. Each new domain still needs DNS pointing
# at the ingress and a TLS certificate (add its host to `tls` below, or use a wildcard/ACME
# solution); the api's own /metrics stays IP-restricted and is scraped in-cluster (see
# k8s/base/api-service.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shurl-redirect
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
spec:
  ingressClassName: nginx
  tls:
    - hosts: [sh.example.com]
      secretName: shurl-tls
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shurl-api
                port:
                  name: http
