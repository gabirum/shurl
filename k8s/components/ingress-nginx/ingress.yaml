apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shurl
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
spec:
  ingressClassName: nginx
  tls:
    - hosts: [sh.example.com]
      secretName: shurl-tls
  rules:
    - host: sh.example.com
      http:
        paths:
          # The public redirect (apps/api/src/links/links.routes.ts's publicLinks, GET /{code})
          # is mounted at the API's root, so it's the catch-all for this host: any one-segment
          # path that isn't one of the exact routes below is a short code and goes to the api.
          # ingress-nginx evaluates Exact before Prefix, and among Prefix matches the longest
          # wins — so /shurl/api and /shurl are safe ahead of the root Prefix rule regardless
          # of order, but Exact rules must exist for /, /health, and /metrics or they'd be
          # swallowed by the api's root Prefix rule (a code param matches any of those strings).
          - path: /shurl/api
            pathType: Prefix
            backend:
              service:
                name: shurl-api
                port:
                  name: http
          - path: /shurl
            pathType: Prefix
            backend:
              service:
                name: shurl-web
                port:
                  name: http
          # / (exact) is the SPA's own root redirect (apps/web/default.conf: 302 -> /shurl/),
          # not a short code.
          - path: /
            pathType: Exact
            backend:
              service:
                name: shurl-web
                port:
                  name: http
          # /health and /metrics are also real short-code shapes; keep them on the web
          # container's probe/placeholder handlers rather than letting the api's root catch-all
          # take them. The api's own /metrics stays IP-restricted and is scraped in-cluster,
          # never through this ingress (see k8s/base/api-service.yaml).
          - path: /health
            pathType: Exact
            backend:
              service:
                name: shurl-web
                port:
                  name: http
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: shurl-web
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shurl-api
                port:
                  name: http
